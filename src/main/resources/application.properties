spring.application.name=MD03
# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/course_db
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Giới hạn dung lượng mỗi file và mỗi request
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Toàn bộ ứng dụng ở mức INFO
logging.level.root=INFO

# Hibernate/JPA ở mức DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# Package service ở mức TRACE
logging.level.com.example.md03.service=TRACE

# Ghi log ra file
logging.file.name=logs/patient_web_service.log

# Kích thước tối đa mỗi file: 2MB
logging.logback.rollingpolicy.max-file-size=2MB

# Giữ tối đa 7 ngày
logging.logback.rollingpolicy.max-history=7

# Định dạng tên file sau khi xoay vòng
logging.logback.rollingpolicy.file-name-pattern=logs/patient_web_service-%d{yyyy-MM-dd}.%i.log.gz